<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product review</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --line: #e2e5ea; --text: #1d2530; --muted: #667085;
      --blue: #2563eb; --green: #15803d; --red: #b42318; --amber: #b54708;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
    header, main { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
    header { padding-top: 24px; }
    h1 { margin: 0; font-size: 22px; }
    header p { margin: 2px 0 18px; color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card); padding: 6px 12px; color: var(--text); }
    button:hover:not(:disabled) { border-color: #b8bfca; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .tab.on { background: var(--text); color: #fff; border-color: var(--text); }
    .tab .n { opacity: .7; margin-left: 4px; }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
    button.ok { background: var(--green); border-color: var(--green); color: #fff; }
    button.danger { color: var(--red); }
    .banner { border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; border: 1px solid; }
    .banner.warn { background: #fffaeb; border-color: #fedf89; color: var(--amber); }
    .banner.info { background: #eff8ff; border-color: #b2ddff; color: #175cd3; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; padding-bottom: 40px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .card.approved { border-color: #86d3a0; }
    .card.rejected { opacity: .75; }
    .card.pushed { border-color: #93b4f5; }
    .shots { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; background: var(--line); }
    .shots img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #eee; }
    .body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
    h2 { margin: 0; font-size: 17px; }
    .price { margin: 0; font-weight: 600; }
    .desc { margin: 0; color: #3a4452; font-size: 14px; max-height: 9.5em; overflow: auto; white-space: pre-wrap; }
    .lang { font-size: 12px; color: var(--muted); }
    .badge { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: #eef0f3; color: var(--muted); text-transform: capitalize; }
    .badge.approved { background: #dcfae6; color: var(--green); }
    .badge.rejected { background: #fee4e2; color: var(--red); }
    .badge.pushed { background: #dbe7ff; color: #1d4ed8; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
    .note { margin: 0; font-size: 13px; color: var(--muted); }
    .err { margin: 0; font-size: 13px; color: var(--red); }
    form.edit { display: flex; flex-direction: column; gap: 10px; }
    label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
    input, textarea, select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); }
    textarea { resize: vertical; }
    .empty { text-align: center; color: var(--muted); padding: 60px 0; grid-column: 1 / -1; }
    .htmx-request { opacity: .7; }
    .shots { position: relative; }
    .zoom { cursor: zoom-in; }
    .zoom:focus-visible { outline: 3px solid var(--blue); outline-offset: -3px; }
    .working { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.85); color: var(--text); font-weight: 600; }
    form.part { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
    label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
    h3 { margin: 0; }
    .variant { margin: 0; display: flex; align-items: center; gap: 8px; }
    .chip { font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 99px; background: #eef2ff; color: #3730a3; text-transform: capitalize; }
    dialog#lightbox { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; overflow: visible; }
    dialog#lightbox::backdrop { background: rgba(10, 14, 20, .88); }
    #lightbox figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #lightbox img { max-width: 94vw; max-height: 84vh; object-fit: contain; border-radius: 6px; background: #111; }
    #lightbox figcaption { color: #e5e7eb; font-size: 14px; text-align: center; }
    #lightbox .lb { position: fixed; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.16); color: #fff; border: 0; font-size: 28px; width: 48px; height: 64px; }
    #lightbox .lb:hover:not(:disabled) { background: rgba(255,255,255,.3); }
    #lightbox .prev { left: 12px; } #lightbox .next { right: 12px; }
    #lightbox .close { position: fixed; top: 12px; right: 12px; background: rgba(255,255,255,.16); color: #fff; border: 0; font-size: 22px; width: 44px; height: 44px; }
  </style>
</head>
<body>
  <header>
    <h1>Product review</h1>
    <p>Check what the pipeline generated, approve it, then push it to the Meta catalogue.
      <a href="/runs">Runs and logs</a></p>
  </header>
  <main>
    {% include "_board.html" %}
  </main>

  <!-- Outside #board on purpose: the board is swapped every few seconds and must not close this. -->
  <dialog id="lightbox" aria-label="Photo viewer">
    <figure>
      <img alt="">
      <figcaption></figcaption>
    </figure>
    <button class="lb prev" type="button" aria-label="Previous photo">&#8249;</button>
    <button class="lb next" type="button" aria-label="Next photo">&#8250;</button>
    <button class="close" type="button" aria-label="Close">&times;</button>
  </dialog>
  <script>
    (function () {
      var dialog = document.getElementById('lightbox');
      var image = dialog.querySelector('img');
      var caption = dialog.querySelector('figcaption');
      var items = [];
      var index = 0;

      function show(next) {
        index = (next + items.length) % items.length;
        image.src = items[index].full;
        image.alt = items[index].caption;
        caption.textContent = items[index].caption + (items.length > 1 ? '  (' + (index + 1) + ' of ' + items.length + ')' : '');
        dialog.querySelector('.prev').hidden = dialog.querySelector('.next').hidden = items.length < 2;
      }

      function open(target) {
        // Read the group when it is clicked: the board is re-rendered, so saved nodes go stale.
        items = Array.prototype.filter
          .call(document.querySelectorAll('img[data-full]'), function (el) { return el.dataset.group === target.dataset.group; })
          .map(function (el) { return { full: el.dataset.full, caption: el.dataset.caption }; });
        show(items.findIndex(function (item) { return item.full === target.dataset.full; }));
        dialog.showModal();
      }

      document.addEventListener('click', function (event) {
        var target = event.target.closest && event.target.closest('img[data-full]');
        if (target) { open(target); return; }
        if (event.target === dialog) dialog.close();           // click on the dark backdrop
        else if (event.target.closest('#lightbox .close')) dialog.close();
        else if (event.target.closest('#lightbox .prev')) show(index - 1);
        else if (event.target.closest('#lightbox .next')) show(index + 1);
      });
      document.addEventListener('keydown', function (event) {
        var target = event.target.closest && event.target.closest('img[data-full]');
        if (target && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); open(target); return; }
        if (!dialog.open || items.length < 2) return;
        if (event.key === 'ArrowLeft') show(index - 1);
        if (event.key === 'ArrowRight') show(index + 1);
      });
    })();
  </script>
</body>
</html>
