[project]
name = "product-catalog"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "google==3.0.0",
    "google-genai==2.16.0",
    "huggingface-hub>=1.26.0",
    "kornia>=0.8.3",
    "load-dotenv>=0.1.0",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "pillow>=12.3.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "scipy>=1.18.0",
    "timm>=1.0.29",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_catalog"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
